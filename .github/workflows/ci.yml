name: ci

# Build-time regression checks for the analysis CLI. The report records
# results and the binary hash; it is not a proof of whole-program correctness.

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: compile · test · eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build release binary
        run: cargo build --release

      - name: Test (workspace)
        run: cargo test --workspace

      - name: Parser verification mutation check
        run: python3 scripts/check_verification_mutations.py parser

      - name: Verification gate (regression + property/fuzz + attestation)
        run: |
          cargo run --release -p trailtracker-eval --bin verify -- \
            --root . \
            --binary target/release/trailtracker \
            --out verification-report.json \
            --cases 20000

      - name: Corpus regression gate (golden snapshots of known codebases)
        # Diffs the analyzer's graph for every vendored corpus crate against its
        # committed golden. Any divergence fails the PR. To bless an intentional
        # change: `cargo run -p trailtracker-eval --bin regress -- --update` and
        # commit the updated eval/golden/*.jsonl in the same PR.
        run: cargo run --release -p trailtracker-eval --bin regress -- --root .

      - name: Ontology golden gate
        run: bash benchmarks/golden_check.sh

      - name: MCP integration tests
        run: python3 mcp/test_mcp.py

      - name: Upload verification report
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: verification-report
          path: verification-report.json

  formal:
    name: formal verification (kani)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.90.0

      - name: Install Kani
        run: |
          cargo install --locked kani-verifier --version 0.68.0
          cargo kani setup

      - name: Prove rewrite schemas and detect selected mutations
        run: bash scripts/verify_kani.sh

      - name: Upload mutation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: kani-mutation-evidence
          path: target/verification-mutations/kani/
